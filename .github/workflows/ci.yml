name: CI

# Runs on every push and pull request: the desktop/extension tests and the
# Android unit tests (which also render the screenshots, so a broken screen
# fails here instead of on someone's phone).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Changelog copies are in sync
        run: node scripts/sync-changelog.js --check
      - name: Extension passes Mozilla's checker
        run: npx --yes web-ext@latest lint --source-dir extension --warnings-as-errors=false

  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ffmpeg is bundled into the app but is too big to keep in git.
      - name: Get ffmpeg
        run: |
          curl -fsSL -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf ffmpeg.tar.xz
          cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe .
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm xvfb
      - run: npm run dist:linux
      - name: Debug asar contents
        run: |
          npx asar list release/linux-unpacked/resources/app.asar > asar.txt
          wc -l asar.txt
          grep -cE "^/extension" asar.txt || true
          grep -E "^/[a-z.]+$" asar.txt
      - name: The browser helper works from the .deb and the AppImage
        run: bash scripts/ci-linux-smoke.sh

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --console=plain
      - name: Keep the rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: android/app/build/screenshots/
          if-no-files-found: ignore
