name: CI

# Runs on every push and pull request: the desktop/extension tests and the
# Android unit tests (which also render the screenshots, so a broken screen
# fails here instead of on someone's phone).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    name: Windows app and extension
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Changelog copies are in sync
        run: node scripts/sync-changelog.js --check
      - name: Extension passes Mozilla's checker
        run: npx --yes web-ext@latest lint --source-dir extension --warnings-as-errors=false

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --console=plain
      - name: Keep the rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: android/app/build/screenshots/
          if-no-files-found: ignore
